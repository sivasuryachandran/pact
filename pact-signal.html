<!doctype html>
<html lang="en">

<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html,body{margin:0;height:100%;background:#050507;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  canvas{display:block}
  .states{position:fixed;right:16px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:2}

  body.still .states{display:none}
  .display{position:fixed;left:56px;bottom:52px;z-index:1;color:#F5F5F7;pointer-events:none;font-family:'Geist','Inter',system-ui,sans-serif}
  .time{font-weight:200;font-size:132px;line-height:.9;letter-spacing:-4px;font-variant-numeric:tabular-nums}

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<body>
<div class="brand">PACT</div>
<div class="foot">Simulated display · demo</div>
<div class="display">
  <div class="time"><span id="time">12:00</span><small id="ampm">PM</small></div>
  <div class="date" id="date"></div>
  <div class="status" id="status"></div>
  <div class="sub" id="sub"></div>
</div>
<div class="states" id="states"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------- params / rng ----------------
const params = new URLSearchParams(location.search);
const STILL = params.has('still');
const SIM = parseFloat(params.get('t') || '4.0');
if (STILL) document.body.classList.add('still');
let seed = 21; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

const STATES = {
  idle:[1.0,0.82,0.52], listening:[0.58,0.50,1.0], approval:[0.98,0.75,0.14],
  allowed:[0.20,0.83,0.60], denied:[0.98,0.44,0.52], private:[0.55,0.55,0.62]
};
const stateCol = new THREE.Color(...(STATES[params.get('state')] || STATES.idle));
const targetCol = stateCol.clone();

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer: STILL });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.setClearColor(0x050507, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.5, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

// ---------------- wing textures (painted in 2D, morpho-inspired, original) ----------------
function wingTexture(kind){
  const N = 1024, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d');
  const P = kind === 'fore' ? foreOutline : hindOutline;          // outline in unit box coords
  const path = new Path2D();
  P.forEach(([x,y],i) => { const X = x*N, Y = (1-y)*N; i ? path.lineTo(X,Y) : path.moveTo(X,Y); });
  path.closePath();
  g.save(); g.clip(path);
  // root of wing is at (0, rootY) in unit coords
  const rx = 0, ry = (1 - (kind==='fore' ? 0.30 : 0.80)) * N;
  // deep electric blue body -> cyan sheen -> violet toward margin
  const rg = g.createRadialGradient(rx, ry, 0, rx, ry, N*1.0);
  rg.addColorStop(0.00, '#0a1a5c');
  rg.addColorStop(0.12, '#1240d8');
  rg.addColorStop(0.40, '#2a7bff');
  rg.addColorStop(0.62, '#3fd2f0');
  rg.addColorStop(0.80, '#6d5cff');
  rg.addColorStop(1.00, '#2a1f6a');
  g.fillStyle = rg; g.fillRect(0,0,N,N);
  // subtle scale streaks
  g.globalAlpha = 0.10; g.strokeStyle = '#ffffff'; g.lineWidth = 1;
  for (let i=0;i<900;i++){ const a = rnd()*1.4-0.7 + (kind==='fore'? 0.35:-0.45), r0 = rnd()*N*1.1;
    g.beginPath(); g.moveTo(rx+Math.cos(a)*r0, ry-Math.sin(a)*r0); g.lineTo(rx+Math.cos(a)*(r0+18), ry-Math.sin(a)*(r0+18)); g.stroke(); }
  g.globalAlpha = 1;
  // veins
  g.strokeStyle = 'rgba(8,10,40,0.55)'; g.lineWidth = 5;
  const veinAngles = kind==='fore' ? [0.62,0.45,0.28,0.10,-0.08,-0.25] : [-0.2,-0.45,-0.7,-0.95,-1.15];
  veinAngles.forEach(a => { g.beginPath(); g.moveTo(rx, ry); g.quadraticCurveTo(rx+Math.cos(a)*N*0.45, ry-Math.sin(a)*N*0.38, rx+Math.cos(a)*N*1.2, ry-Math.sin(a)*N*1.2); g.stroke(); });
  // dark velvet margin (thick stroke clipped inside the outline)
  g.lineJoin='round';
  g.strokeStyle = 'rgba(5,6,18,0.98)'; g.lineWidth = N*0.095; g.stroke(path);
  g.strokeStyle = 'rgba(30,30,80,0.7)'; g.lineWidth = N*0.13; g.globalAlpha=0.5; g.stroke(path); g.globalAlpha=1;
  // pearl spots along the margin
  const spotIdx = kind==='fore' ? [0.30,0.36,0.42,0.48,0.54] : [0.35,0.45,0.55,0.65];
  spotIdx.forEach((u,k) => {
    const i = Math.floor(u*P.length), [x,y] = P[i], [x2,y2] = P[Math.max(0,i-3)];
    const nx = -(y - y2), ny = (x - x2); const L = Math.hypot(nx,ny) || 1;
    const X = (x - nx/L*0.035)*N, Y = (1-(y - ny/L*0.035))*N;
    const sg = g.createRadialGradient(X,Y,0,X,Y,N*0.016);
    sg.addColorStop(0,'rgba(255,250,240,1)'); sg.addColorStop(1,'rgba(255,250,240,0)');
    g.fillStyle = sg; g.beginPath(); g.arc(X,Y,N*0.016,0,Math.PI*2); g.fill();
  });
  g.restore();
  // bright rim line
  g.strokeStyle = 'rgba(140,220,255,0.9)'; g.lineWidth = 6; g.stroke(path);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return tex;
}

// outlines in unit box [0,1]x[0,1]; root on the left edge
function bez(p0,p1,p2,p3,n,out){ for(let i=1;i<=n;i++){ const t=i/n, u=1-t;
  out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } }
const foreOutline = []; { const o=foreOutline; o.push([0.0,0.30]);
  bez([0,0.30],[0.20,0.62],[0.60,0.98],[0.97,0.95],40,o);        // costal edge up to apex
  bez([0.97,0.95],[1.02,0.70],[0.92,0.35],[0.80,0.12],40,o);     // outer margin
  bez([0.80,0.12],[0.55,0.06],[0.22,0.12],[0.0,0.30],40,o); }    // inner margin
const hindOutline = []; { const o=hindOutline; o.push([0.0,0.80]);
  bez([0,0.80],[0.30,0.98],[0.78,0.92],[0.90,0.66],40,o);
  bez([0.90,0.66],[1.00,0.40],[0.72,0.02],[0.40,0.03],40,o);
  bez([0.40,0.03],[0.18,0.06],[0.05,0.40],[0.0,0.80],40,o); }

// ---------------- wing material: texture + view-dependent iridescence + glitter ----------------
function wingMaterial(tex){
  return new THREE.ShaderMaterial({
    uniforms:{ map:{value:tex}, time:{value:0} },
    transparent:true, side:THREE.DoubleSide, depthWrite:false,
    vertexShader:`
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.);
        vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`
      uniform sampler2D map; uniform float time; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        vec4 t=texture2D(map,vUv); if(t.a<0.02) discard;
        float ndv=abs(dot(normalize(vN),normalize(vV)));
        float fres=pow(1.-ndv,2.0);
        // iridescent hue swing: blue -> cyan -> violet with viewing angle
        vec3 iri=mix(vec3(0.15,0.45,1.0), vec3(0.25,0.95,0.95), smoothstep(0.,0.5,fres));
        iri=mix(iri, vec3(0.65,0.45,1.0), smoothstep(0.45,1.,fres));
        float blueMask=smoothstep(0.15,0.6,t.b-t.r*0.5);
        vec3 col=t.rgb*(0.85+0.15*ndv) + iri*blueMask*(0.06+0.55*fres);
        // glitter: sparse twinkling cells
        vec2 cell=floor(vUv*140.); float r=h(cell);
        float tw=pow(max(0.,sin(time*(2.+r*5.)+r*40.)),18.);
        vec2 f=fract(vUv*140.)-.5; float d=length(f);
        float sp=step(0.86,r)*tw*smoothstep(.35,.0,d);
        col+=vec3(1.0,0.97,0.9)*sp*2.2*blueMask;
        gl_FragColor=vec4(col, t.a*0.93);
        #include <colorspace_fragment>
      }`
  });
}

function wingMesh(outline, tex, scale){
  const shape = new THREE.Shape(outline.map(([x,y]) => new THREE.Vector2(x, y)));
  const geo = new THREE.ShapeGeometry(shape, 64);
  // uv = unit coords already
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i=0;i<pos.count;i++){ uv.setXY(i, pos.getX(i), pos.getY(i)); }
  // move root to origin and scale
  const rootY = outline[0][1];
  geo.translate(0, -rootY, 0); geo.scale(scale, scale, scale);
  // gentle camber: bend outward edge slightly
  for (let i=0;i<pos.count;i++){ const x=pos.getX(i), y=pos.getY(i); pos.setZ(i, -0.06*x*x + 0.03*y*y); }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, wingMaterial(tex));
}

const foreTex = wingTexture('fore'), hindTex = wingTexture('hind');

// ---------------- the creature ----------------
const fly = new THREE.Group(); scene.add(fly);
const tilt = new THREE.Group(); fly.add(tilt);          // banking / pitch
const wings = { L:[], R:[] };
for (const side of [1,-1]){
  const hinge = new THREE.Group(); tilt.add(hinge); hinge.position.set(0.02*side, 0.05, 0);
  const fore = wingMesh(foreOutline, foreTex, 1.55); fore.rotation.z = 0.18; fore.position.y = 0.02;
  const hind = wingMesh(hindOutline, hindTex, 1.10); hind.rotation.z = -0.05; hind.position.y = -0.22; hind.position.z = -0.01;
  hinge.add(hind); hinge.add(fore);
  if (side < 0) hinge.scale.x = -1;
  (side>0?wings.R:wings.L).push(hinge);
}
// body
const bodyMat = new THREE.MeshStandardMaterial({ color:0x1b1640, roughness:0.35, metalness:0.2, emissive:0x120e30 });
const head = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), bodyMat); head.position.y = 0.30; tilt.add(head);
const thorax = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.20, 8, 16), bodyMat); thorax.position.y = 0.10; tilt.add(thorax);
const lanternMat = new THREE.MeshBasicMaterial({ color: stateCol.clone().multiplyScalar(3.0) });
const lantern = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.42, 8, 20), lanternMat); lantern.position.y = -0.30; tilt.add(lantern);
// antennae
const antMat = new THREE.MeshBasicMaterial({ color: 0x9d93e8 });
const tipMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0,0.85,0.5).multiplyScalar(1.4) });
for (const s of [1,-1]){
  const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0.03*s,0.35,0), new THREE.Vector3(0.14*s,0.62,0.03), new THREE.Vector3(0.30*s,0.78,0.05));
  tilt.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.008, 6), antMat));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), tipMat); tip.position.copy(curve.getPoint(1)); tilt.add(tip);
}
scene.add(new THREE.AmbientLight(0x8080ff, 0.6));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.2); keyLight.position.set(2,3,5); scene.add(keyLight);

// soft halo sprite around the lantern (lights up the surroundings)
function glowTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.2,'rgba(255,255,255,.5)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); return t; }
const haloMat = new THREE.SpriteMaterial({ map: glowTex(), color: stateCol.clone(), transparent:true, opacity:0.35, blending:THREE.AdditiveBlending, depthWrite:false });
const halo = new THREE.Sprite(haloMat); halo.scale.set(2.4,2.4,1); halo.position.y = -0.42; halo.renderOrder = -1; tilt.add(halo);
const bigHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0x6a58ff, transparent:true, opacity:0.035, blending:THREE.AdditiveBlending, depthWrite:false }));
bigHalo.renderOrder = -2; bigHalo.scale.set(9,9,1); tilt.add(bigHalo);

// ---------------- pixie-dust trail (GPU points, CPU sim) ----------------
const MAX = 6000;
const pPos = new Float32Array(MAX*3), pCol = new Float32Array(MAX*3), pSize = new Float32Array(MAX), pAlpha = new Float32Array(MAX), pKind = new Float32Array(MAX);
const pVel = new Float32Array(MAX*3), pLife = new Float32Array(MAX), pMax = new Float32Array(MAX), pTw = new Float32Array(MAX), pBase = new Float32Array(MAX);
let head_i = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSize,1));
pGeo.setAttribute('alpha', new THREE.BufferAttribute(pAlpha,1));
pGeo.setAttribute('kind', new THREE.BufferAttribute(pKind,1));
const pMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ pr:{ value: renderer.getPixelRatio() } },
  vertexShader:`
    attribute float size; attribute float alpha; attribute float kind; attribute vec3 color;
    varying vec3 vC; varying float vA; varying float vK; uniform float pr;
    void main(){ vC=color; vA=alpha; vK=kind; vec4 mv=modelViewMatrix*vec4(position,1.);
      gl_PointSize=size*pr*(9./-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`
    varying vec3 vC; varying float vA; varying float vK;
    void main(){ vec2 p=gl_PointCoord-.5; float d=length(p);
      float core=exp(-d*d*60.); float soft=exp(-d*d*10.)*0.35;
      float a=core+soft;
      if(vK>0.5){ // 4-point star sparkle
        float sx=exp(-abs(p.y)*70.)*smoothstep(.5,0.,abs(p.x));
        float sy=exp(-abs(p.x)*70.)*smoothstep(.5,0.,abs(p.y));
        a=core*1.2+ (sx+sy)*0.9 + soft*0.5; }
      vec3 c=mix(vC, vec3(1.), core*0.7);
      gl_FragColor=vec4(c*a*vA, a*vA); }`
});
const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; scene.add(points);

const palette = [[1.0,0.86,0.55],[1.0,0.96,0.88],[0.45,0.95,0.92],[0.62,0.55,1.0],[0.45,0.65,1.0],[1.0,0.75,0.92]];
function emit(origin, vel, n){
  for (let k=0;k<n;k++){
    const i = head_i; head_i = (head_i+1) % MAX;
    const s = 0.10 + rnd()*0.18;
    pPos[i*3] = origin.x + (rnd()-0.5)*s; pPos[i*3+1] = origin.y + (rnd()-0.5)*s; pPos[i*3+2] = origin.z + (rnd()-0.5)*s;
    pVel[i*3] = -vel.x*0.05 + (rnd()-0.5)*0.45; pVel[i*3+1] = -vel.y*0.05 + (rnd()-0.5)*0.45; pVel[i*3+2] = (rnd()-0.5)*0.3;
    const star = rnd() < 0.12;
    pKind[i] = star ? 1 : 0;
    pBase[i] = star ? 34 + rnd()*40 : 7 + rnd()*12;
    pMax[i] = star ? 1.6 + rnd()*2.0 : 1.2 + rnd()*2.6; pLife[i] = 0; pTw[i] = rnd()*20;
    const c = rnd() < 0.55 ? palette[rnd()<0.5?0:1] : palette[2 + Math.floor(rnd()*4)];
    pCol[i*3] = c[0]*0.85 + stateCol.r*0.15; pCol[i*3+1] = c[1]*0.85 + stateCol.g*0.15; pCol[i*3+2] = c[2]*0.85 + stateCol.b*0.15;
  }
}
function updateDust(dt, t){
  const damp = Math.pow(0.4, dt);
  for (let i=0;i<MAX;i++){
    if (pMax[i] === 0) continue;
    pLife[i] += dt; const k = pLife[i]/pMax[i];
    if (k >= 1){ pAlpha[i] = 0; pMax[i] = 0; continue; }
    pVel[i*3]*=damp; pVel[i*3+1]=pVel[i*3+1]*damp - 0.12*dt; pVel[i*3+2]*=damp;
    pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
    const fade = k < 0.08 ? k/0.08 : Math.pow(1-k, 1.5);
    const tw = 0.55 + 0.45*Math.sin(t*(7+pTw[i]*0.4) + pTw[i]);
    pAlpha[i] = fade * (pKind[i] ? 1.0 : 0.55 + 0.45*tw);
    pSize[i] = pBase[i] * (0.6 + 0.5*tw);
  }
  for (const a of ['position','color','size','alpha','kind']) pGeo.attributes[a].needsUpdate = true;
}

// ================= behaviour =================
// modes: roam -> (wake) arrive -> listen -> think -> respond -> roam
const DECISIONS = {
  allowed:  { col:[0.20,0.83,0.60], label:'Allowed',               sub:'Within your house rules' },
  approval: { col:[0.98,0.75,0.14], label:'Asking for approval',   sub:'Sent to a parent to confirm' },
  denied:   { col:[0.98,0.44,0.52], label:'Not allowed',           sub:'Blocked by a house rule' }
};
const IDLE = new THREE.Color(...STATES.idle), LISTEN = new THREE.Color(...STATES.listening);
let mode = 'roam', modeT = 0, decision = null, speedMul = 1;
const pos = new THREE.Vector3(0, 0, 0), vel = new THREE.Vector3(0.5, 0.2, 0);
let target = new THREE.Vector3(), cruise = 1.6, cruiseTarget = 1.6, nextCruiseChange = 0;
let flapPhase = 0, simT = 0;
const CENTER = new THREE.Vector3(0.6, 0.2, 2.2);   // "front and centre" (slightly right of the clock)

function halfExtents(z){ const h = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * (camera.position.z - z); return [h*camera.aspect, h]; }
function pickTarget(){
  const z = -5 + rnd()*7.5;                         // far (-5) .. near (2.5)
  const [hx, hy] = halfExtents(z);
  target.set((rnd()*2-1)*hx*0.78, (rnd()*2-1)*hy*0.62, z);
}
pickTarget();

// ---- listening waves (rings) ----
const ringMat = () => new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ k:{value:0}, col:{value:new THREE.Color()} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform float k; uniform vec3 col; varying vec2 vUv;
    void main(){ float d=length(vUv-.5)*2.; float r=k; float w=0.035+0.05*k;
      float a=exp(-pow((d-r)/w,2.))*(1.-k)*(1.-k);
      a+=exp(-pow((d-r)/(w*3.),2.))*0.25*(1.-k);
      gl_FragColor=vec4(col*a*2.4, a); }`
});
const rings = [];
for (let i=0;i<5;i++){ const m = new THREE.Mesh(new THREE.PlaneGeometry(1,1), ringMat()); m.visible=false; m.renderOrder=-3; fly.add(m); rings.push({ m, t:-1, dur:1.8, size:7.5 }); }
let ringClock = 0;
function spawnRing(col, size=7.5, dur=1.8){ const r = rings.find(r=>r.t<0) || rings[0]; r.t=0; r.dur=dur; r.size=size; r.m.material.uniforms.col.value.copy(col); r.m.visible=true; }
function updateRings(dt){ for (const r of rings){ if (r.t<0) continue; r.t+=dt; const k=r.t/r.dur;
  if (k>=1){ r.t=-1; r.m.visible=false; continue; }
  r.m.material.uniforms.k.value=k; const s=r.size*(0.25+0.75*k); r.m.scale.set(s,s,1); r.m.position.set(0,-0.1,-0.05); } }

// ---- thinking energy: motes rising lantern -> head ----
const energy = [];
const eMatBase = new THREE.SpriteMaterial({ map: glowTex(), color: 0x9fe8ff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 });
for (let i=0;i<10;i++){ const s = new THREE.Sprite(eMatBase.clone()); s.scale.set(0.26,0.26,1); tilt.add(s); energy.push(s); }
const coreBand = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), color: 0xe9e4ff, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 }));
coreBand.scale.set(0.7,0.32,1); tilt.add(coreBand);

// ---- decision burst ----
function burst(origin, col, n){
  for (let k=0;k<n;k++){
    const i = head_i; emit(origin, vel, 1);
    const a = rnd()*Math.PI*2, sp = 0.8 + rnd()*1.8;
    pVel[i*3] = Math.cos(a)*sp; pVel[i*3+1] = Math.sin(a)*sp; pVel[i*3+2] = (rnd()-0.5)*0.6;
    pCol[i*3] = col.r*0.8+0.2; pCol[i*3+1] = col.g*0.8+0.2; pCol[i*3+2] = col.b*0.8+0.2;
  }
}

// ---- mode control ----
function setMode(m){ mode = m; modeT = 0; ui(); }
function wake(){ if (mode==='roam' || mode==='respond') { decision=null; setMode('arrive'); } }
function respond(kind){ decision = kind; targetCol.setRGB(...DECISIONS[kind].col); setMode('respond');
  fly.updateMatrixWorld(true); const o = new THREE.Vector3(0,-0.3,0); tilt.localToWorld(o);
  spawnRing(new THREE.Color(...DECISIONS[kind].col), 5.5, 1.4); burst(o, new THREE.Color(...DECISIONS[kind].col), 160); }
let heardText = '';
function decideFrom(text){ // demo only: the real policy engine decides; the firefly just shows it
  const t = (text||'').toLowerCase();
  if (/\b(buy|order|book|pay|purchase)\b/.test(t)) return 'approval';
  if (/\b(unlock|delete|share|private|disable)\b/.test(t)) return 'denied';
  return 'allowed';
}

// ---- step ----
const tmp = new THREE.Vector3(), desired = new THREE.Vector3();
function step(dt){
  simT += dt; modeT += dt;
  // scripted demo timeline
  if (DEMO) demoTick();

  if (mode === 'roam'){
    if (simT > nextCruiseChange){ cruiseTarget = 0.7 + rnd()*2.8; nextCruiseChange = simT + 2 + rnd()*3.5; }
    cruise += (cruiseTarget - cruise) * Math.min(1, dt*0.8);
    if (pos.distanceTo(target) < 0.9) pickTarget();
    desired.copy(target).sub(pos).normalize().multiplyScalar(cruise*speedMul);
    // organic wobble
    desired.x += Math.sin(simT*1.3)*0.35; desired.y += Math.cos(simT*1.7)*0.25;
    vel.lerp(desired, Math.min(1, dt*1.4));
  } else if (mode === 'arrive'){
    const d = pos.distanceTo(CENTER);
    const sp = Math.min(4.5, d*2.2) * Math.max(1, speedMul);
    desired.copy(CENTER).sub(pos).normalize().multiplyScalar(sp);
    vel.lerp(desired, Math.min(1, dt*2.5));
    targetCol.copy(LISTEN);
    if (d < 0.12) setMode('listen');
  } else {
    // hover in the middle with a gentle bob
    const bob = tmp.copy(CENTER); bob.y += Math.sin(simT*1.6)*0.06; bob.x += Math.sin(simT*0.9)*0.04;
    desired.copy(bob).sub(pos).multiplyScalar(3.0);
    vel.lerp(desired, Math.min(1, dt*3));
    if (mode === 'listen'){
      targetCol.copy(LISTEN);
      ringClock -= dt; if (ringClock <= 0){ spawnRing(LISTEN); ringClock = 0.6; }
      if (!DEMO && !voiceActive && modeT > 3.2) setMode('think');
    } else if (mode === 'think'){
      targetCol.copy(LISTEN).lerp(IDLE, 0.35);
      if (!DEMO && modeT > 2.4) respond(decideFrom(heardText));
    } else if (mode === 'respond'){
      if (modeT > 3.2){ targetCol.copy(IDLE); setMode('roam'); pickTarget(); }
    }
  }
  pos.addScaledVector(vel, dt);
  fly.position.copy(pos);

  // attitude
  const calm = mode==='think';
  tilt.rotation.z = THREE.MathUtils.clamp(-vel.x*0.12, -0.55, 0.55) * (calm?0.3:1);
  tilt.rotation.x = -0.55 + THREE.MathUtils.clamp(vel.z*0.10, -0.35, 0.35) + Math.sin(simT*2.0)*0.05;
  tilt.rotation.y = THREE.MathUtils.clamp(vel.x*0.06, -0.35, 0.35);

  // wings: frequency follows speed; calm glide while thinking
  const speed = vel.length();
  let freq, amp, base;
  if (mode==='think'){ freq = 2.6; amp = 0.22; base = 0.30; }
  else if (mode==='listen'){ freq = 7.5; amp = 0.60; base = 0.20; }
  else { freq = 7 + speed*1.6; amp = 0.80; base = 0.15; }
  flapPhase += freq*dt;
  const ang = base + amp*(0.5+0.5*Math.sin(flapPhase));
  wings.R.forEach(w => w.rotation.y = -ang); wings.L.forEach(w => w.rotation.y = ang);

  // colour + lantern
  stateCol.lerp(targetCol, Math.min(1, dt*(mode==='respond'?6:3)));
  let glowAmt = 1.7 + 0.3*Math.sin(simT*1.8);
  if (mode==='think') glowAmt = 0.45 + 0.1*Math.sin(simT*1.2);
  if (mode==='respond') glowAmt = 2.4 - Math.min(1, modeT)*0.5;
  lanternMat.color.copy(stateCol).multiplyScalar(glowAmt);
  haloMat.color.copy(stateCol);
  haloMat.opacity = mode==='respond' ? 0.55 : mode==='think' ? 0.22 : 0.35;

  // thinking energy rising bottom -> top
  const eOn = mode==='think' ? Math.min(1, modeT*2) : Math.max(0, energy[0].material.opacity - dt*3);
  energy.forEach((s,i) => {
    const f = (simT*0.55 + i/energy.length) % 1;
    s.position.set(Math.sin(f*9+i)*0.035, -0.78 + f*1.12, 0.05);
    s.material.opacity = eOn * Math.sin(Math.PI*f) * 0.9;
  });
  const band = (simT*0.55) % 1;
  coreBand.position.set(0, -0.78 + band*1.12, 0.06);
  coreBand.material.opacity = eOn * 1.0 * Math.sin(Math.PI*band);

  // trail (lighter when hovering)
  fly.updateMatrixWorld(true);
  const tip = new THREE.Vector3(0, -0.55, 0); tilt.localToWorld(tip);
  const n = mode==='think' ? (rnd()<0.3?1:0) : Math.round(1 + speed*2.4);
  emit(tip, vel, n);
  updateDust(dt, simT); updateRings(dt);
  wings.R.concat(wings.L).forEach(h => h.children.forEach(m => m.material.uniforms.time.value = simT));
}

// ---- scripted demo (for screenshots / video) ----
const DEMO = params.has('demo');
const ORDER = ['allowed','approval','denied'];
function demoTick(){
  const cyc = 16, t = simT % cyc, k = Math.floor(simT / cyc);
  if (t < 5) { if (mode!=='roam' && mode!=='respond') setMode('roam'); }
  else if (t >= 5 && mode==='roam') wake();
  if (mode==='listen' && modeT > 2.6) setMode('think');
  if (mode==='think' && modeT > 2.6) respond(ORDER[k % 3]);
}

// ================= display UI =================
const $ = id => document.getElementById(id);
function tickClock(){
  const d = new Date();
  let h = d.getHours(), m = d.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12||12;
  $('time').textContent = `${h}:${String(m).padStart(2,'0')}`; $('ampm').textContent = ap;
  $('date').textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
tickClock(); setInterval(tickClock, 1000);
function ui(){
  const s = $('status'), sub = $('sub');
  s.dataset.mode = mode;
  if (mode==='roam'){ s.textContent = 'Say “Hey PACT”'; sub.textContent = voiceActive ? 'Listening for the wake phrase' : 'Press Space or tap Hey PACT'; }
  if (mode==='arrive' || mode==='listen'){ s.textContent = 'Listening…'; sub.textContent = heardText ? `“${heardText}”` : ''; }
  if (mode==='think'){ s.textContent = 'Checking your house rules…'; sub.textContent = heardText ? `“${heardText}”` : ''; }
  if (mode==='respond' && decision){ s.textContent = DECISIONS[decision].label; sub.textContent = DECISIONS[decision].sub;
    const c = DECISIONS[decision].col; s.style.color = `rgb(${c.map(v=>v*255|0).join(',')})`; } else s.style.color = '';
}

// controls
const ctl = $('states');
const btn = (label, fn) => { const b=document.createElement('button'); b.textContent=label; b.onclick=fn; ctl.appendChild(b); return b; };
btn('Hey PACT', () => { heardText=''; wake(); });
btn('Allowed', () => respond('allowed'));
btn('Approval', () => respond('approval'));
btn('Denied', () => respond('denied'));
btn('Slower', () => { speedMul = Math.max(0.3, speedMul-0.25); });
btn('Faster', () => { speedMul = Math.min(2.5, speedMul+0.25); });
addEventListener('keydown', e => {
  if (e.code==='Space'){ e.preventDefault(); heardText=''; wake(); }
  if (e.key==='1') respond('allowed'); if (e.key==='2') respond('approval'); if (e.key==='3') respond('denied');
  if (e.key==='+'||e.key==='=') speedMul = Math.min(2.5, speedMul+0.25);
  if (e.key==='-') speedMul = Math.max(0.3, speedMul-0.25);
});

// voice: Web Speech API wake phrase (Chrome/Edge); push-to-talk above is the fallback
let voiceActive = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR && !STILL){
  const vb = btn('Voice: off', () => { voiceActive ? stopVoice() : startVoice(); });
  let rec = null;
  function startVoice(){
    rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    let silenceTimer = null;
    rec.onresult = ev => {
      const res = ev.results[ev.results.length-1]; const txt = res[0].transcript.trim();
      if (mode==='roam' && /\b(hey\s+)?(pact|packed|pacts|pack|packt)\b/i.test(txt)) { heardText=''; wake(); return; }
      if (mode==='arrive' || mode==='listen'){
        heardText = txt.replace(/^.*?\b(pact|packed|pack|packt)\b[,\s]*/i,''); ui();
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => { if (mode==='listen' || mode==='arrive') setMode('think'); }, res.isFinal ? 300 : 1400);
      }
    };
    rec.onend = () => { if (voiceActive) try { rec.start(); } catch(e){} };
    rec.onerror = e => { if (e.error==='not-allowed'){ voiceActive=false; vb.textContent='Voice: blocked'; } };
    try { rec.start(); voiceActive = true; vb.textContent = 'Voice: on'; ui(); } catch(e){}
  }
  function stopVoice(){ voiceActive = false; try{ rec && rec.stop(); }catch(e){} vb.textContent='Voice: off'; ui(); }
}
ui();

// ================= run =================
if (STILL){
  const dt = 1/60; for (let i=0;i<Math.round(SIM*60);i++) step(dt);
  ui(); composer.render(); document.title = 'ready';
} else {
  let last = performance.now();
  renderer.setAnimationLoop(now => { const dt = Math.min(0.033,(now-last)/1000); last = now; step(dt); composer.render(); });
}
</script>
</body>
