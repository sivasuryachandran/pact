name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Build and core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pact-signal/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix pact-signal
      - name: Build (signal package and UI)
        run: npm run build
      - name: Python tests (policy, MCP, identity, marketplace, product flow)
        run: python -m pytest
      - name: Bypass and security suite (240 adversarial attempts)
        run: python -m pytest -q -s tests/test_bypass.py
      - name: Signal tests
        run: npm run test:signal
      - name: Whitespace check
        run: git diff --check HEAD~1 HEAD

  browser-e2e:
    name: Browser E2E against a real server
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pact-signal/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: |
          npm ci
          npm ci --prefix pact-signal
      - run: npx playwright install --with-deps chromium
      - name: Full verification (starts a throwaway server with a temporary SQLite database)
        run: PYTHON=python scripts/verify_submission.sh
