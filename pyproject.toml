[project]
name = "pact-household-policy-gateway"
version = "0.1.0"
description = "PACT simulated household policy gateway for Alexa+ hackathon"
requires-python = ">=3.11"
dependencies = [
  "boto3[crt]>=1.35.0",
  "mcp>=1.20.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "uvicorn>=0.30.0",
  "starlette>=0.37.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "alexa/tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

